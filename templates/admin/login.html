<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Examination Service Portal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        /* =========================
           ADMIN LOGIN PAGE
        ========================= */

        .admin-login-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            background: #f4f7fa;

        }


        .admin-login-card {

            width: 100%;

            max-width: 460px;

            background: #ffffff;

            border: 1px solid #dfe6ed;

            border-radius: 14px;

            padding: 42px 40px;

            box-shadow: 0 12px 35px rgba(24, 59, 92, 0.08);

        }


        .admin-login-logo {

            width: 52px;

            height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 20px;

            background: #eef4f9;

            border-radius: 11px;

            color: #24609a;

            font-size: 22px;

            font-weight: 700;

        }


        .admin-login-card h1 {

            margin: 0;

            color: #183b5c;

            font-size: 30px;

            font-weight: 700;

        }


        .admin-login-subtitle {

            margin-top: 7px;

            color: #73808d;

            font-size: 14px;

        }


        .admin-login-form {

            margin-top: 32px;

        }


        .admin-login-field {

            margin-bottom: 21px;

        }


        .admin-login-field label {

            display: block;

            margin-bottom: 8px;

            color: #29445d;

            font-size: 13px;

            font-weight: 700;

        }


        .admin-login-field input {

            width: 100%;

            box-sizing: border-box;

            padding: 13px 14px;

            border: 1px solid #cbd7e2;

            border-radius: 7px;

            background: #ffffff;

            color: #263f55;

            font-size: 14px;

            outline: none;

            transition: 0.2s ease;

        }


        .admin-login-field input:focus {

            border-color: #24609a;

            box-shadow: 0 0 0 3px rgba(36, 96, 154, 0.10);

        }


        .admin-login-button {

            width: 100%;

            border: none;

            border-radius: 7px;

            padding: 14px;

            background: #123f73;

            color: #ffffff;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;

        }


        .admin-login-button:hover {

            background: #0e335f;

        }


        .admin-login-back {

            display: inline-block;

            margin-top: 17px;

            color: #24609a;

            font-size: 13px;

            text-decoration: none;

        }


        .admin-login-back:hover {

            text-decoration: underline;

        }


        .admin-login-note {

            margin-top: 27px;

            padding-top: 18px;

            border-top: 1px solid #e7ecf1;

            color: #7a8591;

            font-size: 11px;

            line-height: 1.6;

        }


        @media (max-width: 600px) {

            .admin-login-page {

                padding: 20px;

            }

            .admin-login-card {

                padding: 32px 25px;

            }

        }

    </style>

</head>


<body>


<div class="admin-login-page">


    <div class="admin-login-card">


        <div class="admin-login-logo">
            🛡️
        </div>


        <h1>
            Admin Login
        </h1>


        <p class="admin-login-subtitle">
            Examination Service Portal
        </p>


        <form method="POST"
              class="admin-login-form">


            <div class="admin-login-field">

                <label for="username">
                    Admin Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter admin username"
                    required>

            </div>


            <div class="admin-login-field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required>

            </div>


            <button
                type="submit"
                class="admin-login-button">

                Login to Admin Portal

            </button>


        </form>


        <a href="{{ url_for('home') }}"
           class="admin-login-back">

            ← Back to Home

        </a>


        <div class="admin-login-note">

            Authorized administration access only.
            Use your administrator credentials to continue.

        </div>


    </div>


</div>


</body>

</html>

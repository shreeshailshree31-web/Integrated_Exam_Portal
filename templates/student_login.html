<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Examination Service Portal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-logo">
                ES
            </div>

            <h1>Student Login</h1>

            <p class="login-subtitle">
                Sign in to access your examination services
            </p>


            <form method="POST">

                <label for="usn">
                    USN / Student ID
                </label>

                <input
                    type="text"
                    id="usn"
                    name="usn"
                    placeholder="Enter your USN"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <a href="/" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
